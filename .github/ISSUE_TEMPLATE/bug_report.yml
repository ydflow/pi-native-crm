name: 缺陷反馈 / Bug report
description: 报告可复现的启动、工作台、工具和服务接入问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 提交前请搜索已有 Issue，并移除客户信息与凭据。安全问题请按[安全政策](https://github.com/ydflow/pi-native-crm/blob/main/SECURITY.md)报告。
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: commit、OS、Node、pnpm、本地开发或自托管
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行方式
      options:
        - 真实 CRM 后端
        - 静态交互演示
        - 历史真实模型录制
        - 测试或离线 fixture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 给出最小操作路径，涉及模型或外部服务时注明服务及版本。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志、截图与排查结果
      description: 可附错误信息、请求 ID、发生时间与已执行检查。
