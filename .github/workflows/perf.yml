name: perf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O GITHUB_TOKEN deste job serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público).
# `pnpm build` é local e o relatório de tamanho é escrita em arquivo do runner
# (`>> $GITHUB_STEP_SUMMARY`), sem token. Ver o comentário em ci.yml para o
# porquê de o bloco ficar no topo.
permissions:
  contents: read

# Cancelamento da rodada superada: por JOB (os pesados), nunca no workflow nem
# no agregador — razão medida e a tabela por evento no cabeçalho do ci.yml.

jobs:
  build-and-size:
    # Executor próprio para trabalho nosso quando EXECUTOR_PROPRIO=ligado; o
    # porquê e a guarda contra fork: comentário do e2e-parte no e2e.yml.
    runs-on: ${{ vars.EXECUTOR_PROPRIO == 'ligado' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'pi-native-proprio' || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-and-size-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # "off", não vazio: vazio seleciona o Sentry DA COMUNIDADE
          # (lib/sentry/dsn.ts:8-10). A intenção aqui sempre foi desligar, e
          # com aspas vazias ela não era alcançada — o build seguia com o DSN
          # padrão embutido.
          SENTRY_DSN: "off"

      - name: Report bundle sizes
        run: |
          {
            echo "## Build output sizes"
            du -sh .next 2>/dev/null || true
            if [ -d .next/static ]; then du -sh .next/static; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: Lighthouse CI + bundle-analyzer thresholds deferred (S-12.05 follow-up).

  # Independente das cercas da suíte geral: uma falha anterior não pode esconder
  # a checagem das permissões MCP ou das dependências de produção deste patch.
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-security-regression-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SENTRY_DSN: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5

      - name: Typecheck
        run: pnpm typecheck

      - name: MCP annotations, authorization and secret boundaries
        run: >-
          pnpm test:unit --reporter=verbose
          lib/mcp/server-annotations.test.ts
          lib/mcp/auth-resolve-api-token.test.ts
          lib/mcp/auth-ator.test.ts
          lib/mcp/tools/leads.test.ts
          lib/mcp/tools/start-conversation.test.ts
          lib/mcp/tools/agendamento-aguarda-confirmacao.test.ts
          lib/mcp/tools/comercio.test.ts
          lib/mcp/tools/evolucao-evidence.test.ts
          tests/unit/mcp-servidor-busca-vazia-nao-e-sucesso.test.ts
          tests/unit/cron-routes-scheduled.test.ts
          lib/ai/agents/internal-question-tools.test.ts
          lib/ai/internal-collaboration/feishu-send.test.ts
          app/api/v1/ai/internal-collaboration/feishu/binding/route.test.ts

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=low
